{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerMap - Sesión cerrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'accounts/login.css' %}">
</head>
<body>
    <div class="auth-card" style="text-align:center;">
        <div class="brand-header">
            <div class="brand-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1>CareerMap</h1>
            <div class="university-badge">UNIVERSIDAD EAFIT</div>
        </div>

        <div style="margin:1.5rem 0;">
            <div style="font-size:2.5rem;color:#0f3460;margin-bottom:1rem;">
                <i class="fas fa-check-circle"></i>
            </div>
            <h5 style="color:#1a1a2e;font-weight:700;margin-bottom:0.5rem;">
                Sesión cerrada exitosamente
            </h5>
            <p style="color:#6c757d;font-size:0.9rem;margin-bottom:1.5rem;">
                Serás redirigido al inicio de sesión en <strong id="countdown">2</strong> segundos.
            </p>

            <!-- Barra de progreso -->
            <div style="background:#f0f0f0;border-radius:20px;height:6px;overflow:hidden;margin-bottom:1.5rem;">
                <div id="progress-bar"
                     style="height:100%;width:100%;background:linear-gradient(135deg,#0f3460,#16213e);
                            border-radius:20px;transition:width 1s linear;">
                </div>
            </div>

            <a href="{% url 'login' %}" class="btn btn-login" style="display:inline-block;text-decoration:none;">
                <i class="fas fa-sign-in-alt me-2"></i>Iniciar sesión ahora
            </a>
        </div>
    </div>

    <script>
        const SECONDS = 2;
        let remaining = SECONDS;
        const countdownEl = document.getElementById('countdown');
        const progressBar = document.getElementById('progress-bar');

        // Iniciar reducción de la barra
        setTimeout(() => {
            progressBar.style.width = '0%';
        }, 50);

        const interval = setInterval(() => {
            remaining -= 1;
            countdownEl.textContent = remaining;
            if (remaining <= 0) {
                clearInterval(interval);
                window.location.href = "{% url 'login' %}";
            }
        }, 1000);
    </script>
</body>
</html>
